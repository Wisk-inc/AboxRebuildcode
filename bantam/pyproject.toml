[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bantamtrain"
dynamic = ["version"]
description = "Bantam: train and fine-tune small language models and weather models faster and cheaper on limited compute - Zoom Training, Muon, 8-bit/bf16 low-memory training, LoRA/QLoRA, int8/int4 weights, compressed token and weather-grid stores"
readme = "packaging/README.md"
license = "MIT"
license-files = ["packaging/LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Nathan" }]
keywords = ["llm", "training", "fine-tuning", "lora", "qlora", "efficiency", "muon", "optimizer", "quantization", "weather", "era5", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]
dependencies = ["torch>=2.4", "numpy>=1.24", "zstandard>=0.21"]

[project.optional-dependencies]
data = ["tokenizers", "pyarrow", "huggingface_hub"]
finetune = ["transformers>=4.56", "safetensors", "datasets", "sentencepiece"]
weather = ["xarray", "zarr", "fsspec", "aiohttp"]
# everything the test suite imports (tests that need a missing extra are skipped)
test = ["pytest>=7", "transformers>=4.56", "peft", "safetensors", "tokenizers", "pyarrow",
        "sentencepiece", "matplotlib"]

[project.scripts]
bantam = "bantamtrain.cli:main"
bantamtrain = "bantamtrain.cli:main"

[project.urls]
Source = "https://github.com/Wisk-inc/AboxRebuildcode"

[tool.setuptools.dynamic]
version = { attr = "bantamtrain.__version__" }

[tool.setuptools.packages.find]
include = ["bantamtrain*"]
