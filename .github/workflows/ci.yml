# CPU-only CI for the bantamtrain package (project directory: bantam/).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU torch wheels)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "bantam[test,finetune,data]"
      - name: bantam doctor
        run: bantam doctor
      - name: Tests
        working-directory: bantam
        run: python -m pytest tests -q -m "not slow and not network and not gpu" -p no:cacheprovider

  package:
    name: build + twine check + core-only install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel, twine check --strict
        run: |
          python -m pip install --upgrade pip build twine
          BUILD_DIR="$RUNNER_TEMP/rel" bash bantam/packaging/release.sh
      - name: Install the wheel with core dependencies only and run every command's --help
        run: |
          python -m venv "$RUNNER_TEMP/core"
          PY="$RUNNER_TEMP/core/bin/python"
          "$PY" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          "$PY" -m pip install "$RUNNER_TEMP"/rel/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/core/bin/bantam" --version
          for c in pretrain finetune weather pack-text pack-era5 memory doctor; do
            "$RUNNER_TEMP/core/bin/bantam" "$c" --help > /dev/null
          done
          "$RUNNER_TEMP/core/bin/bantam" doctor
