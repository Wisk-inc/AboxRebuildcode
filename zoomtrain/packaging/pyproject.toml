[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bantamtrain"
version = "0.2.0"
description = "Bantam: train small language models and weather models faster and cheaper on limited compute - Zoom Training, Muon, 8-bit/bf16 low-memory training, int8/int4 weights, compressed token and weather-grid stores"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Nathan" }]
keywords = ["llm", "training", "efficiency", "muon", "optimizer", "quantization", "weather", "era5", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]
dependencies = ["torch>=2.2", "numpy>=1.24", "zstandard>=0.21"]

[project.optional-dependencies]
data = ["tokenizers", "pyarrow", "huggingface_hub"]
finetune = ["transformers>=4.40", "datasets", "sentencepiece"]
weather = ["xarray", "zarr", "fsspec", "aiohttp"]
test = ["pytest"]

[project.urls]
Source = "https://github.com/Wisk-inc/AboxRebuildcode"

[tool.setuptools.packages.find]
include = ["bantamtrain*"]
