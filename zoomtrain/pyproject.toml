[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomtrain"
version = "0.2.0"
description = "Zoom Training: coarse-to-fine resolution annealing + Muon + compact data storage for fast, cheap training of small LLMs and weather models"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "zstandard", "tokenizers", "pyarrow"]

[project.optional-dependencies]
weather = ["xarray", "zarr", "fsspec", "aiohttp"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["zoomtrain*"]
